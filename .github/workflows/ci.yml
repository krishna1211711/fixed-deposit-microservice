name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode test
        working-directory: fd-microservice
      - run: mvn --batch-mode test
        working-directory: api-gateway

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20.19'
          cache: npm
          cache-dependency-path: fd-angular-ui/package-lock.json
      - run: npm ci
        working-directory: fd-angular-ui
      - run: npm audit --omit=dev --audit-level=moderate
        working-directory: fd-angular-ui
      - run: npm run build
        working-directory: fd-angular-ui

  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
        working-directory: notification-service
      - run: python -m unittest discover -s tests
        working-directory: notification-service
      - run: pip install -r requirements.txt
        working-directory: report-service
      - run: python -m py_compile app.py
        working-directory: report-service
      - run: python -m unittest discover -s tests
        working-directory: report-service
      - run: python -m py_compile app.py
        working-directory: notification-service
      - run: pip install -r requirements.txt
        working-directory: audit-service
      - run: python -m unittest discover -s tests
        working-directory: audit-service
      - run: python -m py_compile app.py
        working-directory: audit-service
      - run: pip install -r requirements.txt
        working-directory: accounting-service
      - run: python -m unittest discover -s tests
        working-directory: accounting-service
      - run: python -m py_compile app.py
        working-directory: accounting-service
      - run: docker compose config --quiet
