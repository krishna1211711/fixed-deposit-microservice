<aside class="sidebar glass-card" [class.collapsed]="!isExpanded">
  <div class="sidebar-header">
    <div class="logo-icon"></div>
    <h2 class="brand-text" *ngIf="isExpanded">FD App</h2>
    <button class="toggle-btn" (click)="toggleSidebar()">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
  </div>

  <div class="nav-links">
    <!-- Common Routes -->
    <a routerLink="/dashboard" class="nav-item" [class.active]="isActive('/dashboard')" title="{{ 'nav.dashboard' | translate }}">
      <div class="nav-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      </div>
      <span class="nav-text" *ngIf="isExpanded">{{ 'nav.dashboard' | translate }}</span>
    </a>

    <a routerLink="/fd-calculator" class="nav-item" [class.active]="isActive('/fd-calculator')" title="{{ 'nav.fdCalculator' | translate }}">
      <div class="nav-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect><line x1="8" y1="6" x2="16" y2="6"></line><line x1="16" y1="14" x2="16" y2="14"></line><line x1="16" y1="18" x2="16" y2="18"></line><line x1="12" y1="14" x2="12" y2="14"></line><line x1="12" y1="18" x2="12" y2="18"></line><line x1="8" y1="14" x2="8" y2="14"></line><line x1="8" y1="18" x2="8" y2="18"></line></svg>
      </div>
      <span class="nav-text" *ngIf="isExpanded">{{ 'nav.fdCalculator' | translate }}</span>
    </a>

    <!-- Customer Routes -->
    <ng-container *ngIf="authService.isCustomer()">
      <a routerLink="/fd/list" class="nav-item" [class.active]="isActive('/fd/list')" title="{{ 'nav.myFds' | translate }}">
        <div class="nav-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
        </div>
        <span class="nav-text" *ngIf="isExpanded">{{ 'nav.myFds' | translate }}</span>
      </a>
    </ng-container>

    <!-- Officer / Admin Routes -->
    <ng-container *ngIf="authService.isAdmin() || authService.isOfficer()">
      <a routerLink="/fd/list" class="nav-item" [class.active]="isActive('/fd/list')" title="{{ 'nav.allFds' | translate }}">
        <div class="nav-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path><line x1="12" y1="11" x2="12" y2="17"></line><line x1="9" y1="14" x2="15" y2="14"></line></svg>
        </div>
        <span class="nav-text" *ngIf="isExpanded">{{ 'nav.allFds' | translate }}</span>
      </a>

      <a routerLink="/fd/create" class="nav-item" [class.active]="isActive('/fd/create')" title="{{ 'nav.createFd' | translate }}">
        <div class="nav-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
        </div>
        <span class="nav-text" *ngIf="isExpanded">{{ 'nav.createFd' | translate }}</span>
      </a>
    </ng-container>

    <!-- Admin Routes -->
    <ng-container *ngIf="authService.isAdmin()">
      <div class="nav-divider"></div>
      <a routerLink="/admin/batch" class="nav-item" [class.active]="isActive('/admin/batch')" title="{{ 'nav.batchControl' | translate }}">
        <div class="nav-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
        </div>
        <span class="nav-text" *ngIf="isExpanded">{{ 'nav.batchControl' | translate }}</span>
      </a>

      <a routerLink="/admin/time-travel" class="nav-item" [class.active]="isActive('/admin/time-travel')" title="{{ 'nav.timeTravel' | translate }}">
        <div class="nav-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        </div>
        <span class="nav-text" *ngIf="isExpanded">{{ 'nav.timeTravel' | translate }}</span>
      </a>
    </ng-container>

    <div class="nav-divider"></div>
    <a routerLink="/reports" class="nav-item" [class.active]="isActive('/reports')" title="{{ 'nav.reports' | translate }}">
      <div class="nav-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
      </div>
      <span class="nav-text" *ngIf="isExpanded">{{ 'nav.reports' | translate }}</span>
    </a>
  </div>
</aside>
