<nav class="navbar glass-card">
  <div class="nav-left">
    <h2 class="nav-brand">{{ 'nav.title' | translate }}</h2>
  </div>
  
  <div class="nav-right">
    <button class="lang-btn" (click)="toggleLanguage()">
      {{ currentLang === 'en' ? 'हिंदी' : 'English' }}
    </button>
    
    <div class="user-profile">
      <div class="avatar">{{ authService.getUsername().charAt(0).toUpperCase() }}</div>
      <div class="user-info">
        <span class="username">{{ authService.getUsername() }}</span>
        <span class="role-badge">{{ authService.getRole() }}</span>
      </div>
    </div>
    
    <button class="logout-btn" (click)="logout()">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
    </button>
  </div>
</nav>
