<div class="auth-container">
  <div class="auth-card glass-card animate-fade-in">
    <div class="auth-header">
      <div class="logo-icon"></div>
      <h2>{{ 'nav.title' | translate }}</h2>
      <p class="subtitle">{{ 'auth.register' | translate }}</p>
    </div>

    <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
      <div class="form-group">
        <label class="form-label" for="username">{{ 'auth.username' | translate }}</label>
        <input type="text" id="username" name="username" class="form-control" [(ngModel)]="userData.username" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">{{ 'auth.email' | translate }}</label>
        <input type="email" id="email" name="email" class="form-control" [(ngModel)]="userData.email" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">{{ 'auth.password' | translate }}</label>
        <input type="password" id="password" name="password" class="form-control" [(ngModel)]="userData.password" required>
      </div>

      <div class="error-msg text-danger mt-4" *ngIf="error">
        {{ error }}
      </div>

      <button type="submit" class="btn btn-primary w-full mt-4" [disabled]="!registerForm.form.valid || loading">
        <span *ngIf="!loading">{{ 'auth.registerBtn' | translate }}</span>
        <span *ngIf="loading">{{ 'common.loading' | translate }}</span>
      </button>
    </form>

    <div class="auth-footer text-center mt-4">
      <a routerLink="/login">{{ 'auth.haveAccount' | translate }}</a>
    </div>
  </div>
</div>
