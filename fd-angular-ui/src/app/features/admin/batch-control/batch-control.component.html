<div class="batch-container animate-fade-in">
  <div class="header-section mb-4">
    <h2>Batch Control Panel</h2>
    <p class="text-muted">Execute system-wide batch processes manually.</p>
  </div>

  <div class="grid grid-cols-3 gap-4">
    <div class="glass-card text-center" *ngFor="let job of jobs">
      <div class="icon-wrapper bg-primary-light mb-4 mx-auto">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline>
        </svg>
      </div>
      
      <h3 class="mb-4">{{ job.name }}</h3>
      
      <button class="btn btn-primary w-full mb-4" (click)="runJob(job)" [disabled]="job.loading">
        {{ job.loading ? 'Running...' : 'Run Now' }}
      </button>

      <div class="job-result" [ngClass]="{'text-success': job.result.includes('Success'), 'text-danger': job.result.includes('Failed')}" *ngIf="job.result">
        {{ job.result }}
      </div>
    </div>
  </div>
</div>
