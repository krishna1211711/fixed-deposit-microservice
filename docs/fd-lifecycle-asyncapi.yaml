asyncapi: 3.0.0
info:
  title: Fixed Deposit Domain Events
  version: 1.1.0
  description: Versioned at-least-once events emitted through the FD transactional outbox. Consumers must deduplicate by eventId.
defaultContentType: application/json
channels:
  fdLifecycle:
    address: fd.lifecycle.v1
    messages:
      fdDomainEvent:
        $ref: '#/components/messages/FdDomainEvent'
  fdLifecycleDeadLetter:
    address: fd.lifecycle.v1.dlq
    messages:
      failedFdDomainEvent:
        $ref: '#/components/messages/FailedFdDomainEvent'
operations:
  publishFdDomainEvent:
    action: send
    channel: { $ref: '#/channels/fdLifecycle' }
  consumeFdDomainEvent:
    action: receive
    channel: { $ref: '#/channels/fdLifecycle' }
  publishDeadLetter:
    action: send
    channel: { $ref: '#/channels/fdLifecycleDeadLetter' }
components:
  messages:
    FdDomainEvent:
      name: FdDomainEvent
      payload: { $ref: '#/components/schemas/FdDomainEvent' }
    FailedFdDomainEvent:
      name: FailedFdDomainEvent
      payload:
        type: object
        required: [sourceTopic, failedAt, error, event]
        properties:
          sourceTopic: { type: string }
          failedAt: { type: string, format: date-time }
          error: { type: string, maxLength: 1000 }
          event: { $ref: '#/components/schemas/FdDomainEvent' }
  schemas:
    FdDomainEvent:
      type: object
      additionalProperties: true
      required: [schemaVersion, eventId, correlationId, producer, occurredAt, eventType, aggregateType, aggregateId]
      properties:
        schemaVersion: { type: string, const: '1.0' }
        eventId: { type: string, format: uuid }
        correlationId: { type: string, description: End-to-end request or batch correlation identifier }
        causationId: { type: [string, 'null'] }
        producer: { type: string, const: fd-account-service }
        occurredAt: { type: string, format: date-time }
        eventType:
          type: string
          enum:
            - FD_CREATION_REQUESTED
            - FD_CREATION_APPROVED
            - FD_CREATION_REJECTED
            - FD_OPENED
            - INTEREST_ACCRUED
            - INTEREST_CAPITALIZED
            - INTEREST_PAID
            - FD_MATURED
            - FD_RENEWED
            - FD_PREMATURELY_CLOSED
            - FD_TRANSACTION_RECORDED
        aggregateType:
          type: string
          enum: [FD_OPENING_REQUEST, FD_ACCOUNT, FD_TRANSACTION]
        aggregateId: { type: string }
        customerId: { type: [string, 'null'] }
        fdAccountNo: { type: [string, 'null'] }
        productCode: { type: [string, 'null'] }
        currency: { type: [string, 'null'], pattern: '^[A-Z]{3}$' }
        amount: { type: [number, 'null'] }
        businessDate: { type: [string, 'null'], format: date }
        status: { type: [string, 'null'] }
        principalAmount: { type: [number, 'null'] }
        currentBalance: { type: [number, 'null'] }
        accruedInterest: { type: [number, 'null'] }
        interestRate: { type: [number, 'null'] }
        tenureMonths: { type: [integer, 'null'] }
        maturityDate: { type: [string, 'null'], format: date }
        transactionType: { type: [string, 'null'] }
        transactionReference: { type: [string, 'null'] }
        debitGlAccount: { type: [string, 'null'] }
        creditGlAccount: { type: [string, 'null'] }
        subject: { type: [string, 'null'] }
        messageBody: { type: [string, 'null'] }
