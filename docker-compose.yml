services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: fd-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  mysql:
    image: mysql:8.0
    container_name: fd-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-fd_root_demo_password}
      MYSQL_DATABASE: ${DB_NAME:-fd_bank_db}
      MYSQL_USER: ${DB_USERNAME:-fd_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-fd_demo_password}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-fd_root_demo_password}"]
      interval: 5s
      timeout: 5s
      retries: 20

  notification-mysql:
    image: mysql:8.0
    container_name: fd-notification-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${NOTIFICATION_DB_ROOT_PASSWORD:-notification_root_demo_password}
      MYSQL_DATABASE: ${NOTIFICATION_DB_NAME:-notification_db}
      MYSQL_USER: ${NOTIFICATION_DB_USERNAME:-notification_user}
      MYSQL_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification_demo_password}
    volumes:
      - notification-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${NOTIFICATION_DB_ROOT_PASSWORD:-notification_root_demo_password}"]
      interval: 5s
      timeout: 5s
      retries: 20

  report-mysql:
    image: mysql:8.0
    container_name: fd-report-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${REPORT_DB_ROOT_PASSWORD:-report_root_demo_password}
      MYSQL_DATABASE: ${REPORT_DB_NAME:-report_db}
      MYSQL_USER: ${REPORT_DB_USERNAME:-report_user}
      MYSQL_PASSWORD: ${REPORT_DB_PASSWORD:-report_demo_password}
    volumes:
      - report-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${REPORT_DB_ROOT_PASSWORD:-report_root_demo_password}"]
      interval: 5s
      timeout: 5s
      retries: 20

  audit-mysql:
    image: mysql:8.0
    container_name: fd-audit-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${AUDIT_DB_ROOT_PASSWORD:-audit_root_demo_password}
      MYSQL_DATABASE: ${AUDIT_DB_NAME:-audit_db}
      MYSQL_USER: ${AUDIT_DB_USERNAME:-audit_user}
      MYSQL_PASSWORD: ${AUDIT_DB_PASSWORD:-audit_demo_password}
    volumes:
      - audit-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${AUDIT_DB_ROOT_PASSWORD:-audit_root_demo_password}"]
      interval: 5s
      timeout: 5s
      retries: 20

  accounting-mysql:
    image: mysql:8.0
    container_name: fd-accounting-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${ACCOUNTING_DB_ROOT_PASSWORD:-accounting_root_demo_password}
      MYSQL_DATABASE: ${ACCOUNTING_DB_NAME:-accounting_db}
      MYSQL_USER: ${ACCOUNTING_DB_USERNAME:-accounting_user}
      MYSQL_PASSWORD: ${ACCOUNTING_DB_PASSWORD:-accounting_demo_password}
    volumes:
      - accounting-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${ACCOUNTING_DB_ROOT_PASSWORD:-accounting_root_demo_password}"]
      interval: 5s
      timeout: 5s
      retries: 20

  fd-service:
    build: ./fd-microservice
    container_name: fd-microservice
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-fd_bank_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-fd_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-fd_demo_password}
      JWT_SECRET: ${JWT_SECRET:-fd-local-demo-secret-change-before-any-real-deployment}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_EVENTS_KAFKA_ENABLED: "true"
      FD_EVENTS_TOPIC: fd.lifecycle.v1
      APP_TIME_TRAVEL_ENABLED: "true"
      BANKING_TIME_ZONE: Asia/Kolkata
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "9090:9090"
    depends_on:
      fd-service:
        condition: service_healthy
      report-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
      accounting-service:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET:-fd-local-demo-secret-change-before-any-real-deployment}
      FD_SERVICE_URI: http://fd-service:8080
      IDENTITY_SERVICE_URI: ${IDENTITY_SERVICE_URI:-http://fd-service:8080}
      PRODUCT_SERVICE_URI: ${PRODUCT_SERVICE_URI:-http://fd-service:8080}
      REPORT_SERVICE_URI: http://report-service:5000
      AUDIT_SERVICE_URI: http://audit-service:5002
      ACCOUNTING_SERVICE_URI: http://accounting-service:5003

  angular-ui:
    build: ./fd-angular-ui
    container_name: angular-ui
    ports:
      - "4200:80"
    depends_on:
      gateway:
        condition: service_started

  report-service:
    build: ./report-service
    container_name: report-service
    expose:
      - "5000"
    depends_on:
      report-mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FD_EVENTS_TOPIC: fd.lifecycle.v1
      KAFKA_CONSUMER_GROUP: fd-report-service-v1
      REPORT_DB_HOST: report-mysql
      REPORT_DB_PORT: 3306
      REPORT_DB_USER: ${REPORT_DB_USERNAME:-report_user}
      REPORT_DB_PASSWORD: ${REPORT_DB_PASSWORD:-report_demo_password}
      REPORT_DB_NAME: ${REPORT_DB_NAME:-report_db}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20

  notification-service:
    build: ./notification-service
    container_name: fd-notification-service
    expose:
      - "5001"
    depends_on:
      notification-mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FD_EVENTS_TOPIC: fd.lifecycle.v1
      KAFKA_CONSUMER_GROUP: fd-notification-service-v1
      FD_EVENTS_DLQ_TOPIC: fd.lifecycle.v1.dlq
      NOTIFICATION_DB_HOST: notification-mysql
      NOTIFICATION_DB_PORT: 3306
      NOTIFICATION_DB_USER: ${NOTIFICATION_DB_USERNAME:-notification_user}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification_demo_password}
      NOTIFICATION_DB_NAME: ${NOTIFICATION_DB_NAME:-notification_db}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 10s
      timeout: 5s
      retries: 20

  audit-service:
    build: ./audit-service
    container_name: fd-audit-service
    expose:
      - "5002"
    depends_on:
      audit-mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FD_EVENTS_TOPIC: fd.lifecycle.v1
      KAFKA_CONSUMER_GROUP: fd-audit-service-v1
      AUDIT_DB_HOST: audit-mysql
      AUDIT_DB_PORT: 3306
      AUDIT_DB_USER: ${AUDIT_DB_USERNAME:-audit_user}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:-audit_demo_password}
      AUDIT_DB_NAME: ${AUDIT_DB_NAME:-audit_db}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/health')"]
      interval: 10s
      timeout: 5s
      retries: 20

  accounting-service:
    build: ./accounting-service
    container_name: fd-accounting-service
    expose:
      - "5003"
    depends_on:
      accounting-mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FD_EVENTS_TOPIC: fd.lifecycle.v1
      KAFKA_CONSUMER_GROUP: fd-accounting-service-v1
      ACCOUNTING_DB_HOST: accounting-mysql
      ACCOUNTING_DB_PORT: 3306
      ACCOUNTING_DB_USER: ${ACCOUNTING_DB_USERNAME:-accounting_user}
      ACCOUNTING_DB_PASSWORD: ${ACCOUNTING_DB_PASSWORD:-accounting_demo_password}
      ACCOUNTING_DB_NAME: ${ACCOUNTING_DB_NAME:-accounting_db}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5003/health')"]
      interval: 10s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: fd-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mysql-data:
  notification-mysql-data:
  report-mysql-data:
  audit-mysql-data:
  accounting-mysql-data:
