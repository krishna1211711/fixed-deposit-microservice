server:
  port: 9090

jwt:
  secret: ${JWT_SECRET:fd-local-demo-secret-change-before-any-real-deployment}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: report-health-route
          uri: ${REPORT_SERVICE_URI:http://localhost:5000}
          predicates:
            - Path=/reports/health
          filters:
            - SetPath=/health
        - id: report-route
          uri: ${REPORT_SERVICE_URI:http://localhost:5000}
          predicates:
            - Path=/reports/**
          filters:
            - JwtValidationFilter
            - StripPrefix=1
        - id: auth-route
          uri: ${FD_SERVICE_URI:http://localhost:8080}
          predicates:
            - Path=/api/auth/**
        - id: api-route
          uri: ${FD_SERVICE_URI:http://localhost:8080}
          predicates:
            - Path=/api/**
          filters:
            - JwtValidationFilter
        - id: manual-report-compatibility-route
          uri: ${FD_SERVICE_URI:http://localhost:8080}
          predicates:
            - Path=/report/**
          filters:
            - JwtValidationFilter

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
