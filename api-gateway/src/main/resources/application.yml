server:
  port: 9090

jwt:
  secret: ${JWT_SECRET:fd-local-demo-secret-change-before-any-real-deployment}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: report-health-route
              uri: ${REPORT_SERVICE_URI:http://localhost:5000}
              predicates:
                - Path=/reports/health
              filters:
                - SetPath=/health
            - id: report-route
              uri: ${REPORT_SERVICE_URI:http://localhost:5000}
              predicates:
                - Path=/reports/**
              filters:
                - JwtValidationFilter
                - StripPrefix=1
            - id: distributed-audit-route
              uri: ${AUDIT_SERVICE_URI:http://localhost:5002}
              predicates:
                - Path=/distributed-audit/**
              filters:
                - JwtValidationFilter
                - StripPrefix=1
            - id: accounting-route
              uri: ${ACCOUNTING_SERVICE_URI:http://localhost:5003}
              predicates:
                - Path=/accounting/**
              filters:
                - JwtValidationFilter
                - StripPrefix=1
            - id: auth-route
              uri: ${IDENTITY_SERVICE_URI:http://localhost:8080}
              predicates:
                - Path=/api/auth/**
            - id: product-route
              uri: ${PRODUCT_SERVICE_URI:http://localhost:8080}
              predicates:
                - Path=/api/product/**
              filters:
                - JwtValidationFilter
            - id: report-api-route
              uri: ${REPORT_SERVICE_URI:http://localhost:5000}
              predicates:
                - Path=/api/report/**
              filters:
                - JwtValidationFilter
                - StripPrefix=2
            - id: api-route
              uri: ${FD_SERVICE_URI:http://localhost:8080}
              predicates:
                - Path=/api/**
              filters:
                - JwtValidationFilter
            - id: manual-report-compatibility-route
              uri: ${FD_SERVICE_URI:http://localhost:8080}
              predicates:
                - Path=/report/**
              filters:
                - JwtValidationFilter

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
