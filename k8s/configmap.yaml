apiVersion: v1
kind: ConfigMap
metadata:
  name: fd-config
  namespace: fd-banking
data:
  DB_HOST: "mysql-service"
  DB_PORT: "3306"
  DB_NAME: "fd_bank_db"
  FD_SERVICE_URI: "http://fd-service:8080"
  NOTIFICATION_DB_HOST: "notification-mysql-service"
  NOTIFICATION_DB_PORT: "3306"
  NOTIFICATION_DB_NAME: "notification_db"
  SPRING_PROFILES_ACTIVE: "prod"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  FD_EVENTS_TOPIC: "fd.lifecycle.v1"
  FD_EVENTS_DLQ_TOPIC: "fd.lifecycle.v1.dlq"
  KAFKA_CONSUMER_GROUP: "fd-notification-service-v1"
  SMTP_HOST: "mailpit-service"
  SMTP_PORT: "1025"
