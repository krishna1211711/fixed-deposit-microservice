apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service-deployment
  namespace: fd-banking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: fd-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: fd-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: fd-config
                  key: DB_NAME
            - name: DB_USER
              value: root
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fd-secret
                  key: DB_PASSWORD
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: fd-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: FD_EVENTS_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: fd-config
                  key: FD_EVENTS_TOPIC
            - name: KAFKA_CONSUMER_GROUP
              valueFrom:
                configMapKeyRef:
                  name: fd-config
                  key: KAFKA_CONSUMER_GROUP
            - name: SMTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: fd-config
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: fd-config
                  key: SMTP_PORT
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 20
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: fd-banking
spec:
  selector:
    app: notification-service
  ports:
    - port: 5001
      targetPort: 5001
