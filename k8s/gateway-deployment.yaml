apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
  namespace: fd-banking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9090
            initialDelaySeconds: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9090
            initialDelaySeconds: 45
          env:
            - name: JWT_SECRET
              valueFrom:
                configMapKeyRef:
                  name: fd-config
                  key: JWT_SECRET
            - name: FD_SERVICE_URI
              value: "http://fd-service:8080"
