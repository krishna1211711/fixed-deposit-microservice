apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fd-service-hpa
  namespace: fd-banking
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fd-service-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
