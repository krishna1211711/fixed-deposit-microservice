





openapi: 3.0.3
info:
  title: Fixed Deposit (FD) Microservice - FD Account Module API
  description: Official OpenAPI 3.0 specification for the FD bounded context. Human users submit maker requests and a distinct CHECKER authorizes them; the direct creation command is internal-only.
  version: 1.2.0
servers:
  - url: http://localhost:8080/api/fd
    description: Direct Microservice Base URL
  - url: http://localhost:9090/api/fd
    description: API Gateway Base URL (Token Relay)

security:
  - BearerAuth: []

paths:
  /admin/business-date:
    get:
      servers: [{ url: 'http://localhost:9090/api' }]
      summary: Read the controlled Banking Date
      description: ADMIN only. Time Travel is reported as enabled only in a sandbox/test deployment.
      tags: [FD Operations]
      responses:
        '200':
          description: Current controlled date
          content:
            application/json:
              schema:
                type: object
                required: [businessDate, timeTravelEnabled]
                properties:
                  businessDate: { type: string, format: date }
                  timeTravelEnabled: { type: boolean }

  /admin/batch/runs:
    get:
      servers: [{ url: 'http://localhost:9090/api' }]
      summary: Read auditable FD batch runs
      description: ADMIN only. Returns the latest job/date claims and processing counts.
      tags: [FD Operations]
      responses:
        '200':
          description: Recent batch executions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BatchRun' }

  /opening-requests:
    post:
      summary: Submit an FD opening request
      description: CUSTOMER may submit only for the customerId in the JWT; BANK_OFFICER acts as maker. This does not create an FD until a different CHECKER approves it. Eligibility categories come from the customer profile and cannot be selected by the caller.
      operationId: submitFdOpeningRequest
      tags: [FD Opening Workflow]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 80, pattern: '^[A-Za-z0-9._:-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FdAccountCreateRequest' }
      responses:
        '200':
          description: Pending request (or the existing idempotent result)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FdOpeningRequestResponse' }
        '409': { $ref: '#/components/responses/400BadRequest' }

  /opening-requests/mine:
    get:
      summary: List opening requests submitted by the current customer or maker
      tags: [FD Opening Workflow]
      responses:
        '200':
          description: Request history
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/FdOpeningRequestResponse' } }

  /opening-requests/pending:
    get:
      summary: List requests awaiting checker action
      description: CHECKER only.
      tags: [FD Opening Workflow]
      responses:
        '200':
          description: Pending requests
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/FdOpeningRequestResponse' } }

  /opening-requests/{requestId}/approve:
    post:
      summary: Approve and atomically open the FD
      description: CHECKER only. Maker and checker usernames must differ; a repeated decision cannot create a second FD.
      tags: [FD Opening Workflow]
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalDecisionRequest' }
      responses:
        '200':
          description: Approved request including generated fdAccountNo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FdOpeningRequestResponse' }

  /opening-requests/{requestId}/reject:
    post:
      summary: Reject an FD opening request
      description: CHECKER only; rejection reason is mandatory.
      tags: [FD Opening Workflow]
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalDecisionRequest' }
      responses:
        '200':
          description: Rejected request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FdOpeningRequestResponse' }

  /calculate:
    post:
      summary: Calculate an FD maturity projection
      description: Manual-compatible calculator endpoint for any authenticated role. The backend resolves the base rate from the product and, for customers, resolves verified category benefits from the authenticated customer identity. Client-supplied rates or categories are not accepted.
      operationId: calculateFd
      tags:
        - FD Calculator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productCode, principal, termMonths]
              properties:
                productCode: { type: string, example: FD_STD }
                principal: { type: number, format: double, minimum: 1000 }
                termMonths: { type: integer, minimum: 1 }
                compoundingFrequency: { type: string, default: QUARTERLY }
      responses:
        '200':
          description: Maturity projection
          content:
            application/json:
              schema:
                type: object
                properties:
                  maturityAmount: { type: number }
                  interestEarned: { type: number }
                  effectiveRate: { type: number }
                  categoryAddons: { type: object, additionalProperties: true }
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'

  /account/create:
    post:
      summary: Internal system command to create the approved FD
      description: ROLE_SYSTEM only. Human CUSTOMER, BANK_OFFICER, CHECKER and ADMIN callers must use the opening-request workflow. Creates the account, initial DEPOSIT and FD_OPENED outbox event atomically.
      operationId: createFdAccount
      tags:
        - FD Account Lifecycle
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated stable key for this logical account-opening command.
          schema:
            type: string
            minLength: 8
            maxLength: 80
            pattern: '^[A-Za-z0-9._:-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FdAccountCreateRequest'
            example:
              customerId: "CUST10045"
              productCode: "FD_STD"
              principalAmount: 200000.00
              termMonths: 12
              branchCode: "001"
              currency: "INR"
      responses:
        '200':
          description: FD Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FdAccountResponse'
              example:
                fdAccountNo: "0010000018"
                customerId: "CUST10045"
                productCode: "FD_STD"
                currency: "INR"
                principalAmount: 200000.00
                interestRate: 7.50
                tenureMonths: 12
                compoundingFrequency: "QUARTERLY"
                status: "ACTIVE"
                maturityDate: "2027-08-27"
                accruedInterest: 0.00
                createdAt: "2026-08-27T11:15:00"
                createdBy: "officer_01"
                initialTransactionId: 1001
                message: "Account created successfully with initial deposit"
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          description: Idempotency-Key was already used with a different request payload

  /account/create-with-txn:
    $ref: '#/paths/~1account~1create'

  /accounts/my:
    get:
      summary: Fetch Logged-in Customer's FD Portfolio
      description: Returns all Fixed Deposit accounts associated with the currently authenticated customer based on JWT context.
      operationId: getMyAccounts
      tags:
        - Portfolio & Queries
      responses:
        '200':
          description: List of customer's FD accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FdAccountResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /accounts/all:
    get:
      summary: Fetch All FD Accounts (Bank Officer / Admin)
      description: Returns a complete list of all Fixed Deposit accounts across all customers for branch management and administrative oversight.
      operationId: getAllAccounts
      tags:
        - Portfolio & Queries
      responses:
        '200':
          description: List of all FD accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FdAccountResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'

  /account/{fdAccountNo}:
    get:
      summary: Get FD Account Details by Account Number
      description: Fetches complete details of a specific Fixed Deposit account.
      operationId: getAccountDetails
      tags:
        - Portfolio & Queries
      parameters:
        - name: fdAccountNo
          in: path
          required: true
          description: The 10-digit unique FD Account Number
          schema:
            type: string
          example: "0010000018"
      responses:
        '200':
          description: Account details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FdAccountResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'

  /account/{fdAccountNo}/transactions:
    get:
      summary: Fetch Double-Entry Transaction Ledger for FD Account
      description: Retrieves the immutable insert-only transaction history for an FD account, including debit and credit General Ledger (GL) mappings.
      operationId: getAccountTransactions
      tags:
        - Ledger & Statements
      parameters:
        - name: fdAccountNo
          in: path
          required: true
          schema:
            type: string
          example: "0010000018"
      responses:
        '200':
          description: List of transaction ledger records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FdTransaction'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'

  /account/{fdAccountNo}/statements:
    get:
      summary: Fetch Daily and Final Statement Snapshots for FD Account
      description: Retrieves idempotent daily statement entries plus the final closure statement, separately recording accrued, capitalized and paid interest.
      operationId: getAccountStatements
      tags:
        - Ledger & Statements
      parameters:
        - name: fdAccountNo
          in: path
          required: true
          schema:
            type: string
          example: "0010000018"
      responses:
        '200':
          description: List of daily and final statement snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FdStatement'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'

  /account/withdraw:
    post:
      summary: Execute Premature FD Withdrawal & Penalty Deduction
      description: Calculates interest accrued up to the withdrawal date, applies the product-configured penalty deduction (e.g., rate reduction by 1.0%), updates account status to `PREMATURE_CLOSED`, posts payout and GL entries atomically, and transfers funds.
      operationId: processPrematureWithdrawal
      tags:
        - Lifecycle & Closures
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawalRequest'
            example:
              fdAccountNo: "0010000018"
              withdrawalDate: "2027-02-27"
              transferAccount: "SB00056789"
              remarks: "Premature withdrawal requested by customer"
      responses:
        '200':
          description: Premature withdrawal processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalResponse'
              example:
                status: "PREMATURE_CLOSED"
                message: "FD Account prematurely closed with penalty applied"
                fdAccountNo: "0010000018"
                withdrawalAmount: 205600.00
                principalReturned: 200000.00
                interestEarned: 7000.00
                penaltyApplied: 1400.00
                effectiveRate: 6.50
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'

  /account/manual-close:
    post:
      summary: Execute Manual Maturity Closure
      description: Allows a Bank Officer or Admin to manually close a matured FD account and trigger the maturity payout GL entries.
      operationId: manualCloseFdAccount
      tags:
        - Lifecycle & Closures
      parameters:
        - name: fdAccountNo
          in: query
          required: true
          description: Account number to close
          schema:
            type: string
          example: "0010000018"
      responses:
        '200':
          description: Account closed manually
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Pass standard JWT Bearer token obtained from `/api/auth/login`.

  responses:
    400BadRequest:
      description: Bad Request / Business Validation Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            success: false
            message: "Principal amount is below minimum deposit requirement of 1000.00"
            data: null
            timestamp: "2026-08-27T11:20:00"

    401Unauthorized:
      description: Missing or Invalid JWT Token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            success: false
            message: "Full authentication is required to access this resource"
            data: null
            timestamp: "2026-08-27T11:20:00"

    403Forbidden:
      description: Insufficient Role Privileges
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            success: false
            message: "Access Denied: Requires BANK_OFFICER or ADMIN role"
            data: null
            timestamp: "2026-08-27T11:20:00"

    404NotFound:
      description: Resource Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            success: false
            message: "FD Account not found: 0010000018"
            data: null
            timestamp: "2026-08-27T11:20:00"

  schemas:
    BatchRun:
      type: object
      properties:
        batch_id: { type: string, format: uuid }
        job_name: { type: string }
        business_date: { type: string, format: date }
        status: { type: string, enum: [RUNNING, COMPLETED, FAILED] }
        attempt_count: { type: integer }
        records_found: { type: integer }
        records_processed: { type: integer }
        records_failed: { type: integer }
        triggered_by: { type: string }
        trigger_source: { type: string, enum: [SCHEDULED, MANUAL, TIME_TRAVEL, BOD_CATCHUP, INTERNAL] }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        last_error: { type: string, nullable: true }

    FdAccountCreateRequest:
      type: object
      required:
        - customerId
        - productCode
        - principalAmount
        - termMonths
        - branchCode
      properties:
        customerId:
          type: string
          description: Unique customer identification code
        productCode:
          type: string
          description: Code of the pre-configured FD product (e.g. FD_STD)
        principalAmount:
          type: number
          format: double
          minimum: 1000.00
          description: Deposit amount
        termMonths:
          type: integer
          minimum: 1
          description: Duration in months
        branchCode:
          type: string
          minLength: 3
          maxLength: 3
          description: 3-digit branch identifier
        currency:
          type: string
          default: "INR"
          enum: [INR, USD, EUR, GBP, JPY, AED, KWD]
        categories:
          type: array
          readOnly: true
          items:
            type: string
          description: Verified customer-profile eligibility copied by the server; caller values are ignored.
        compoundingFrequency:
          type: string
          enum: [MONTHLY, QUARTERLY, HALF_YEARLY, YEARLY]
          description: Must be one of the selected product's allowed capitalization options
        payoutFrequency:
          type: string
          enum: [MONTHLY, QUARTERLY, HALF_YEARLY, YEARLY, MATURITY]
          default: MATURITY
        maturityInstruction:
          type: string
          enum: [PAYOUT, RENEW_PRINCIPAL, RENEW_PRINCIPAL_AND_INTEREST]
          default: PAYOUT
        startDate:
          type: string
          format: date
          description: Contract value date; defaults to the controlled Banking Date
        payoutAccountRef:
          type: string
          description: Opaque account reference owned by the external Payment/Account service

    FdAccountResponse:
      type: object
      properties:
        fdAccountNo:
          type: string
          description: Generated 10-digit account number (Branch + Seq + Checksum)
        customerId:
          type: string
        customerName:
          type: string
          description: Owner name snapshot captured when the FD is booked
        customerCategory:
          type: string
        productCode:
          type: string
        productVersion:
          type: string
          description: Immutable pricing-rule version captured at booking
        calculationType:
          type: string
          enum: [COMPOUND]
        payoutAccountRef:
          type: string
          description: External account reference; FD does not join to an account-service table
        currency:
          type: string
        principalAmount:
          type: number
          format: double
        currentBalance:
          type: number
          format: double
        interestRate:
          type: number
          format: double
          description: Final effective annual interest rate (%) after category add-ons and rate cap
        dayCountConvention:
          type: string
          enum: [ACTUAL_365]
        tenureMonths:
          type: integer
        compoundingFrequency:
          type: string
          enum: [MONTHLY, QUARTERLY, HALF_YEARLY, YEARLY]
        payoutFrequency:
          type: string
          enum: [MONTHLY, QUARTERLY, HALF_YEARLY, YEARLY, MATURITY]
        maturityInstruction:
          type: string
          enum: [PAYOUT, RENEW_PRINCIPAL, RENEW_PRINCIPAL_AND_INTEREST]
        status:
          type: string
          enum: [ACTIVE, CLOSED, PREMATURE_CLOSED, RENEWED]
        startDate:
          type: string
          format: date
        maturityDate:
          type: string
          format: date
        accruedInterest:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        initialTransactionId:
          type: integer
          format: int64
        message:
          type: string

    WithdrawalRequest:
      type: object
      required:
        - fdAccountNo
      properties:
        fdAccountNo:
          type: string
        withdrawalDate:
          type: string
          format: date
          description: Date of withdrawal (defaults to current date if omitted)
        transferAccount:
          type: string
          description: Target customer savings account for payout
        remarks:
          type: string

    WithdrawalResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
        fdAccountNo:
          type: string
        withdrawalAmount:
          type: number
          format: double
          description: Net payout (Principal + Accrued Interest - Penalty)
        principalReturned:
          type: number
          format: double
        interestEarned:
          type: number
          format: double
        penaltyApplied:
          type: number
          format: double
        effectiveRate:
          type: number
          format: double

    FdTransaction:
      type: object
      properties:
        txnId:
          type: integer
          format: int64
        fdAccountNo:
          type: string
        txnType:
          type: string
          enum: [DEPOSIT, INTEREST_ACCRUAL, INTEREST_CAPITALIZATION, INTEREST_PAYOUT, FD_MATURITY, FD_RENEWAL, PREMATURE_CLOSURE, PENALTY]
        amount:
          type: number
          format: double
        currency:
          type: string
        debitGlAccount:
          type: string
          description: General Ledger Debit account name
        creditGlAccount:
          type: string
          description: General Ledger Credit account name
        status:
          type: string
        txnTimestamp:
          type: string
          format: date-time
        businessDate:
          type: string
          format: date
        referenceId:
          type: string
        remarks:
          type: string
        uuid:
          type: string

    FdStatement:
      type: object
      properties:
        statementId:
          type: integer
          format: int64
        fdAccountNo:
          type: string
        statementDate:
          type: string
          format: date
        openingBalance:
          type: number
          format: double
        interestAccrued:
          type: number
          format: double
        interestCapitalized:
          type: number
          format: double
        interestPaid:
          type: number
          format: double
        accruedInterest:
          type: number
          format: double
          description: Accrued but not yet capitalized/paid; excluded from currentBalance
        lastAccrualDate: { type: string, format: date }
        lastCapitalizationDate: { type: string, format: date }
        nextCapitalizationDate: { type: string, format: date }
        lastPayoutDate: { type: string, format: date }
        nextPayoutDate: { type: string, format: date }
        prematureClosureAllowed: { type: boolean }
        prematureClosurePenaltyPct: { type: number }
        closureDate: { type: string, format: date }
        closureType: { type: string }
        closureReason: { type: string }
        closureGrossInterest: { type: number }
        closurePenaltyAmount: { type: number }
        closureNetPayout: { type: number }
        closureTransferAccountMasked: { type: string }
        closedBy: { type: string }
        renewalAccountNo: { type: string }
        closureDate: { type: string, format: date, nullable: true }
        closureType: { type: string, enum: [PREMATURE, MATURITY_PAYOUT, MATURITY_RENEWAL], nullable: true }
        closureReason: { type: string, nullable: true }
        closureGrossInterest: { type: number, nullable: true }
        closurePenaltyAmount: { type: number, nullable: true }
        closureNetPayout: { type: number, nullable: true }
        closureTransferAccountMasked: { type: string, nullable: true }
        closedBy: { type: string, nullable: true }
        closingBalance:
          type: number
          format: double

    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string

    ApprovalDecisionRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 500 }

    FdOpeningRequestResponse:
      type: object
      properties:
        requestId: { type: string, format: uuid }
        requesterUsername: { type: string }
        requesterRole: { type: string, enum: [CUSTOMER, BANK_OFFICER] }
        customerId: { type: string }
        customerName: { type: string }
        productCode: { type: string }
        principalAmount: { type: number }
        currency: { type: string }
        status: { type: string, enum: [PENDING_CHECKER, APPROVED, REJECTED, CANCELLED] }
        checkerUsername: { type: string, nullable: true }
        decisionReason: { type: string, nullable: true }
        fdAccountNo: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }
        data:
          type: object
        timestamp:
          type: string
          format: date-time
